name: Authenticated home bundle regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-e2e-test-accounts
  cancel-in-progress: false
jobs:
  home-e2e:
    runs-on: ubuntu-latest
    environment: home-e2e
    timeout-minutes: 15
    env:
      E2E_SUPABASE_URL: https://ahmvrflklvmdprolauuy.supabase.co
      E2E_ALLOWED_PROJECT_REF: ahmvrflklvmdprolauuy
      E2E_SUPABASE_PUBLIC_KEY: sb_publishable_xHOMOBKKbMdhNGryL43VNw_LxlMteRW
      E2E_SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/e2e/provision-ci.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
