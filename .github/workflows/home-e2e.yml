name: Authenticated home bundle regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - '.github/workflows/home-e2e.yml'
permissions:
  contents: read
concurrency:
  group: home-e2e-test-accounts
  cancel-in-progress: false
jobs:
  home-e2e:
    # Secrets are never made available to fork PRs or outside authors.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    environment: home-e2e
    timeout-minutes: 15
    env:
      E2E_SUPABASE_URL: https://ahmvrflklvmdprolauuy.supabase.co
      E2E_ALLOWED_PROJECT_REF: ahmvrflklvmdprolauuy
      E2E_SUPABASE_PUBLIC_KEY: sb_publishable_xHOMOBKKbMdhNGryL43VNw_LxlMteRW
      E2E_SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/e2e/provision-ci.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
